meters:
- name: api_requests
  description: Count of billable API requests
  unit: request
  aggregation: sum
  dimensions:
  - api
  - endpoint
  - tier
  - region
  - consumer
- name: data_egress
  description: Bytes returned over the network in API responses
  unit: GB
  aggregation: sum
  dimensions:
  - api
  - region
  - consumer
- name: compute_seconds
  description: Server-side compute consumed by the request, where applicable
  unit: second
  aggregation: sum
  dimensions:
  - api
  - endpoint
  - tier
