    Price_Authority:
      type: object
      properties:
        priceAuthority:
          type: object
          required:
          - priceAuthorityGroups
          properties:
            priceAuthorityOwnerIssuedName:
              type: string
              description: 'A name must be assigned by the Owner of a Price Authority which is combined with the Owner''s ID, an Owner Issued Number, and an optional Owner Issued Item Number to help uniquely identify an official document (Authority) containing price(s) for shipment(s).  It may consist of any alpha numeric character string excluding special characters, which may be a minimum of one character and a maximum of ten characters in length; examples include:  BNSF, BNSFQ, QTYELLOW, C, CIRC, NSPQ, MA42MW, etc.

                '
              example: BNSFQ (Carload) --OR-- QTTSSLC (Intermodal)
            priceAuthorityNumber:
              type: number
              format: float
              description: 'A number can be assigned by the Owner of a Price Authority such that it can be combined with the Owner''s ID, an Owner Issued Name, and an optional Owner Issued Item Number to help uniquely identify an official document (Authority) containing price(s) for shipment(s).  If the Owner does not wish to create a specific number, then the Owner must identify this number as 9999999999 (ten 9''s) to indicate there is no specific Price Authority Owner Issued Number.  The only characters allowed in the number are zero (0) through nine (9) and one decimal point (if needed).  The number must not exceed ten (10) characters in length; a decimal point counts as a character.  The number of positions to the right of the decimal point must not exceed four (4) characters.

                '
              example: 105355
            priceAuthorityItemNumber:
              type: number
              format: float
              description: 'A number that Identifies an Owner Issued Item (or Implementing Agreement) which is used to identify a more granular reference to a given price when combined with the Owner ID, Owner Issued Name, and Owner Issued Number.  Marketing sometimes divides a given Price Authority into what might be referred to as sub-authorities which are identified by a given Owner Issued Item Number.  The only characters allowed in the number are zero (0) through nine (9) and one decimal point (if needed).  The number must not exceed ten (10) characters in length; a decimal point counts as a character.  The number of positions to the right of the decimal point must not exceed four (4) characters:  eg, ''00123.4567'' would be valid.  If a Price Authority does not actually have a item number, then the item number will be set to '' '' (Blank).

                '
              example: 100
            priceAuthorityRevisionNumber:
              type: string
              description: 'Identifies the Revision of a given Price Authority as it changes over time.  When a Pricing Authority is created, Marketing starts the revision numbering for it at 0 (zero), which indicates that the Pricing Authority is brand new (the first initial creation of it).  After the initial creation of the authority, the revision number is incremented by one each time Marketing decides and makes a revision to the Pricing Authority which is for external publication. This differs from a Pricing Authority internal only change where the Version Number is incremented alone and the Revision Number remains the same.  For example a PA currently set at Version Number #10 and the Revision Number still set as #5 indicates there have been more internal changes than external changes.  Revision Numbers begin the series at #0 (zero).

                '
              example: '29'
            priceAuthorityOwnerId:
              type: string
              description: 'A two to four character alpha abbreviation which identifies the Owner of a Price Authority.   An Owner ID is usually a SCAC (Standard Carrier Alpha Code) used to designate a transportation company. SCACs are assigned by the National Motor Freight Traffic Association (NMFTA).  Examples of a railroad SCAC include:  BNSF, NS, UP.  Sometimes, however, the Owner ID might be an abbreviation for a Tarrif Bureau.  Examples of a Tariff Bureau include:  WRTA = "Western Railroad Traffic Association", RPS = "Railroad Publishing Services".

                '
              example: BNSF
            priceAuthorityVersionNumber:
              type: number
              format: float
              description: 'Every time a Price Authority is to be changed by Marketing for Pricing, the Pricing Authority Version Number is incremented by one, no matter whether it is an internal or external (reported to a customer) change.  This differs from a Pricing Authority external change where the Version Number is incremented as well as the Revision Number.  For example a PA can be set at Version Number 10 and the Revision Number may not have changed from 5, because there have been more internal changes than external changes.  Version Numbers begin the series with a value of 1 (one).

                '
              example: 37
            priceAuthorityVersionId:
              type: number
              format: float
              description: "The identifier of the Price Authority Version table. \n"
              example: 1411524
            priceAuthorityFileId:
              type: string
              description: 'An identification of the internal identifier (alpha numeric) assigned to a Price Authority generated from either the Legacy Rate Price Management System (RPMS) or from RAPID /Price Translator.  This internal identifier is a business term (Price Authority File ID) that is used and referenced by the Marketing Department as well as other business areas.

                '
              example: 0212242279
            priceAuthorityGeneralRuleSet:
              type: string
              description: 'Identifies the General Rules that apply to the Prices within the given Price Authority. '
              example: Freight charges must be prepaid. Price applies in U.S. Funds. Price does not apply on shipments accorded transit, inspection, sampling, reconsignment, diversion, or stopping in transit for loading or unloading.
            prices:
              type: array
              description: Identifies an array of one or more rates within a given Price Authority.
              items:
                type: object
                description: Identifies the price data elements that are common (are core) to most Price Authorities.
                properties:
                  priceAuthorityPriceEffectiveDate:
                    type: string
                    format: date
                    description: 'Effective Date.  (yyyy-mm-dd format)

                      '
                    example: '2019-09-01'
                  priceAuthorityPriceExpirationDate:
                    type: string
                    format: date
                    description: 'Expiration Date.  (yyyy-mm-dd format)

                      '
                    example: '2020-08-31'
                  priceAuthorityPriceAmount:
                    type: string
                    description: 'Identifies the rate amount of a given Price Package qualified by the Rate Unit Calculation Code (RT_UNT_CALCTN_CD) and Currency Type Code (CURR_TYP_CD) within that Price Package.

                      '
                    example: '913.0000'
                  unitOfMeasure:
                    type: string
                    description: 'indicate the unit of measure that the price can be applied. For example: PC - per car, PT - Per net ton, etc...'
                    example: PC
                  priceAuthorityPriceUnitCalculationCode:
                    type: string
                    description: 'Identifies the rate unit calculation code for a Rate Amount (RT_AMT) within a given Price Package qualified by the Currency Type Code (CURR_TYP_CD) within that Price Package.

                      '
                    example: IM
                  priceAuthorityPriceCurrencyTypeCode:
                    type: string
                    description: 'Identifies the currency type that is to be used.  Valid values are: ''U'' United States; ''C'' = Canada, ''M'' = Mexico.

                      '
                    example: USD
                  minimumWeightQuantity:
                    type: string
                    description: "The Quantity of Weight (if present and not zero) that will be used as the Minimum Weight to rate a weight-based shipment if the actual lading weight is less than this minimum weight.\n\nFor example, if the Minimum Weight Quantity is 50,000 (pounds) and the actual lading weight of the shipment is 20,000 (pounds), the shipment will be rated at the minimum 50,000.\n\nThis is used to protect that a customer does not load up a car with only 100 pounds of lading for a shipment from California to Illinois where the rate is $10.00 per hundred pounds.\n\nA minimum weight quantity of 50,000 pounds means that the customer must pay at least $5,000 for such a shipment. \n"
                    example: '5000'
                  minimumWeightQuantityUomCode:
                    type: string
                    description: 'Identifies what unit of measure that the Minimum Weight is expressed in, e.g., pounds ("LB"), net tons ("PT"), etc.  Example: if the Minimum Weight Quantity is 500, then this can be 500 pounds, 500 net tons, etc.'
                    example: LB
                  originGeographicTypeCode:
                    type: string
                    description: 'Identifies the type of geography (eg.  city, state, zip code, etc.).  Examples include: ''AC'' = OPSL Station Name (City),  ''CO''= County, ''SP'' = States/Provinces, ''PQ'' = ZIP 3, ''PS'' = ZIP 5, ''FS'' = FREIGHT STATIONS, ''S2'' = two digit SPLC, ''S4'' = four digit SPLC, ''S6'' = six digit SPLC.  Canadian Postal Region Codes may be added in the future as ''PU''.  ''OL'' = OPSL number ranges may be added in the future.

                      '
                    example: AC
                  originStationName:
                    type: string
                    description: 'OPEN AND PREPAID STATION LIST NAME. OPEN AND PREPAID STATION LIST (OPSL) IS AN OFFICIAL LIST OF ALL STATIONS IN THE UNITED STATES THAT ARE LEGAL AND OFFICIAL RAILROAD STATIONS THAT A SHIPMENT MAY BE BILLED TO OR FROM. THIS LIST ALSO HAS SPECIAL INSTRUCTIONS THAT APPLY TO EACH STATION

                      '
                    example: CHICAGO
                  originStateCode:
                    type: string
                    description: 'The identifier of the State / Province.  '
                    example: IL
                  originSwitchingLimitsUsedIndicator:
                    type: string
                    description: "Indicates \"T\" (True) or \"F\" (False) whether the price is valid also for all revenue stations within the Switching Limits of the Origin.  This is based on the origin rail carrier in the revenue route and how that carrier defines what other stations (if any) are included within the switching limits of that origin station.\n\nFor example, BNSF says CICERO, IL (and some other Illinois stations) are within the Switching Limits of CHICAGO, IL, but CSXT says that CICERO, IL and HAMMOND, IN (different state) are within SWL of CHICAGO. \n"
                    minLength: 1
                    maxLength: 1
                    example: T
                  originGeographicGroupName:
                    type: string
                    description: 'Identifies a given short name for a specific geographic group within a given business group.  The members of geographic groups may be different between different business groups even though the group name may be the same.

                      '
                    example: CHICAGO & LPC
                  originGeographicGroupNumber:
                    type: string
                    description: "A unique key that identifies a given geographic group that being used as origin in a service price package. \n   \nThe members of geographic groups may be different between different business groups even though the group name may be the same\n"
                    example: '375200646'
                  destinationGeographicTypeCode:
                    type: string
                    description: 'Identifies the type of geography (eg.  city, state, zip code, etc.).  Examples include: ''AC'' = OPSL Station Name (City),  ''CO''= County, ''SP'' = States/Provinces, ''PQ'' = ZIP 3, ''PS'' = ZIP 5, ''FS'' = FREIGHT STATIONS, ''S2'' = two digit SPLC, ''S4'' = four digit SPLC, ''S6'' = six digit SPLC.  Canadian Postal Region Codes may be added in the future as ''PU''.  ''OL'' = OPSL number ranges may be added in the future.

                      '
                    example: AC
                  destinationStationName:
                    type: string
                    description: 'OPEN AND PREPAID STATION LIST NAME. OPEN AND PREPAID STATION LIST (OPSL) IS AN OFFICIAL LIST OF ALL STATIONS IN THE UNITED STATES THAT ARE LEGAL AND OFFICIAL RAILROAD STATIONS THAT A SHIPMENT MAY BE BILLED TO OR FROM. THIS LIST ALSO HAS SPECIAL INSTRUCTIONS THAT APPLY TO EACH STATION

                      '
                    example: SEATTLE
                  destinationStateCode:
                    type: string
                    description: "The identifier of the State / Province.  \n"
                    example: WA
                  destinationSwitchingLimitsUsedIndicator:
                    type: string
                    description: "Indicates \"T\" (True) or \"F\" (False) whether the price is valid also for all revenue stations within the Switching Limits of the Destination.  This is based on the destination rail carrier in the revenue route and how that carrier defines what other stations (if any) are included within the switching limits of that destination station.\n\nFor example, BNSF says CICERO, IL (and some other Illinois stations) are within the Switching Limits of CHICAGO, IL, but CSXT says that CICERO, IL and HAMMOND, IN (different state) are within SWL of CHICAGO. \n"
                    minLength: 1
                    maxLength: 1
                    example: F
                  destinationGeographicGroupName:
                    type: string
                    description: 'Identifies a given short name for a specific geographic group within a given business group.  The members of geographic groups may be different between different business groups even though the group name may be the same.

                      '
                    example: SEATTLE PORTS
                  destinationGeographicGroupNumber:
                    type: string
                    description: 'A unique key that identifies a given specific geographic group being used as destination in a service price package. '
                    example: '216601236'
                  serviceCode:
                    type: string
                    description: The first column of the Shipment Condition Code is the 'V' field (Value field). This identifies the Intermodal Service Code when the Shipment Condition code (SHPMT_COND_ELE_CD) is set to ISCO.
                    example: '25'
                  bnsfServiceLevelCode:
                    type: string
                    description: The first column of the Shipment Condition Code is the 'V' field (Value field). This identifies the BNSF Intermodal Service Level Code when the Shipment Condition code (SHPMT_COND_ELE_CD) is set to BN06.
                    example: P
                  priorOriginGeographicTypeCode:
                    type: string
                    description: 'The first column of the Shipment Condition Code is the ''V'' field (Value field). This identifies the Prior Origin Geographic Type Code when the  Shipment Condition code (SHPMT_COND_ELE_CD) is set to ACPO.

                      '
                    example: SL
                  priorOriginFirstQualifierName:
                    type: string
                    description: 'This is the second column of the Shipment Condition and is referred to as the ''F'' field (Range From field).  The ''F'' field might not be a range. This identifies the Prior Origin First Qualifier Name when the  Shipment Condition code (SHPMT_COND_ELE_CD) is set to ACPO.

                      '
                    example: 093900
                  priorOriginSecondQualifierName:
                    type: string
                    description: 'This is the third column of the Shipment Condition and is referred to as the ''T'' field (Range To field).  The ''T'' field might not be a range. This identifies the Prior Origin Second Qualifier Name when the  Shipment Condition code (SHPMT_COND_ELE_CD) is set to ACPO.

                      '
                    example: 093989
                  finalDestinationGeographicTypeCode:
                    type: string
                    description: 'The first column of the Shipment Condition Code is the ''V'' field (Value field). This identifies the Final Destination Geographic Type Code when the  Shipment Condition code (SHPMT_COND_ELE_CD) is set to ACFD.

                      '
                    example: PS
                  finalDestinationFirstQualifierName:
                    type: string
                    description: 'This is the second column of the Shipment Condition and is referred to as the ''F'' field (Range From field).  The ''F'' field might not be a range. This identifies the Final Destination First Qualifier Name when the  Shipment Condition code (SHPMT_COND_ELE_CD) is set to ACFD.

                      '
                    example: '66210'
                  finalDestinationSecondQualifierName:
                    type: string
                    description: 'This is the third column of the Shipment Condition and is referred to as the ''T'' field (Range To field).  The ''T'' field might not be a range. This identifies the Final Destination Second Qualifier Name when the  Shipment Condition code (SHPMT_COND_ELE_CD) is set to ACFD.

                      '
                    example: '66219'
                  servicePricePackageId:
                    type: number
                    format: float
                    description: 'The identifier of the Service Price Package table.  This is a surrogate key identity column of table TSVC_PRC_PKG.

                      '
                    example: 31608704
                  servicePackageCommodityLowStcc:
                    type: string
                    description: 'Identifies the low end STCC (Standard Transportation Commodity Code) code number within a range, otherwise it identifies a non-range single STCC to be used.

                      '
                    example: '4611110'
                  servicePackageCommodityHighStcc:
                    type: string
                    description: 'Identifies the high end STCC (Standard Transportation Commodity Code) code number within a range of STCC.

                      '
                    example: '4611127'
                  servicePackageLoadEmptyCode:
                    type: string
                    description: Code indicate whether the price can applied to Load or Empty intermodal move
                    example: E
                  commodityGroupShortName:
                    type: string
                    description: 'Identifies a given short name for a specific commodity group within a given business group.  The members of commodity groups may be different between different business groups even though the group name may be the same.

                      '
                    example: EMPTY CONTAINER
                  commodityGroupLongName:
                    type: string
                    description: 'Identifies a given long name for a specific commodity group within a given business group.  The members of commodity groups may be different between different business groups even though the group name may be the same.

                      '
                    example: EMPTY CONTAINER
                  commodityGroupNumber:
                    type: string
                    description: A unique key that identifies a specific commodity group used in a service price package of a price authority.
                    example: '104093082'
                  revenueRouteDescription:
                    type: string
                    description: 'A description of the Route with the carrier abbreviations and the off-going junction abbreviations.

                      '
                    example: BNSF Direct
                  equipmentTypeDescription:
                    type: string
                    description: 'A description of the Equipment Type which may be a railcar or other intermodal type of transport carried on rail.

                      '
                    example: BOXCAR (Carload) --OR-- CONTAINER (Intermodal)
                  equipmentOwnerTypeLabel:
                    type: string
                    description: 'A name or label given to describe whether the equipment owner is a Shipper or a Rail Carrier or is unknown.

                      '
                    example: SHIPPER OWNED
                  equipmentUsageStatusCode:
                    type: string
                    description: 'Identifies if the equipment is empty or loaded and this applies mainly to Intermodal, so Carload can be blank.

                      '
                    example: EMPTY
                  equipmentGroupShortDescription:
                    type: string
                    description: 'A short description of a given Shipment Contition Group as of a specified Version. This identifies the Equipment when the  Shipment Condition Group Version has a Group Type Code (SHPMT_COND_GRP_TYP_CD) is set to "E".

                      '
                    example: 20CM
                  equipmentGroupShortName:
                    type: string
                    description: 'Identifies a given short name for a specific Shipment Condition group within a given business group.  The members of Shipment Condition groups may be different between different business groups even though the group name may be the same. This identifies the Equipment when the  Shipment Condition Group Version has a Group Type Code (SHPMT_COND_GRP_TYP_CD) is set to "E".

                      '
                    example: 20CM-MAX. CONT. W/O CHASSIS
                  equipmentGroupLongName:
                    type: string
                    description: 'Identifies a given long name for a specific Shipment Condition group within a given business group.  The members of Shipment Condition groups may be different between different business groups even though the group name may be the same. This identifies the Equipment when the  Shipment Condition Group Version has a Group Type Code (SHPMT_COND_GRP_TYP_CD) is set to "E".

                      '
                    example: 20 FOOT MAXIMUM LENGTH CONTAINER WITHOUT A CHASSIS
                  equipmentMinimumInsideLengthFeetInches:
                    type: string
                    description: This is the second column of the Shipment Condition and is referred to as the 'F' field (Range From field).  The 'F' field might not be a range. This identifies the Equipment Minimum Inside Length in Feet and Inches when the  Shipment Condition code (SHPMT_COND_ELE_CD) is set to EQIL.
                    example: 000-00
                  equipmentMaximumInsideLengthFeetInches:
                    type: string
                    description: This is the third column of the Shipment Condition and is referred to as the 'T' field (Range To field).  The 'T' field might not be a range. This identifies the Equipment Maximum Inside Length in Feet and Inches when the  Shipment Condition code (SHPMT_COND_ELE_CD) is set to EQIL.
                    example: 015-11
                  equipmentMinimumOutsideLengthFeetInches:
                    type: string
                    description: 'This is the second column of the Shipment Condition and is referred to as the ''F'' field (Range From field).  The ''F'' field might not be a range. This identifies the Equipment Minimum Outside Length in Feet and Inches when the  Shipment Condition code (SHPMT_COND_ELE_CD) is set to EQOL.

                      '
                    example: 000-00
                  equipmentMaximumOutsideLengthFeetInches:
                    type: string
                    description: 'This is the third column of the Shipment Condition and is referred to as the ''T'' field (Range To field).  The ''T'' field might not be a range. This identifies the Equipment Maximum Outside Length in Feet and Inches when the  Shipment Condition code (SHPMT_COND_ELE_CD) is set to EQOL.

                      '
                    example: 020-00
                  servicePackageConditionGroupShortName:
                    type: string
                    description: Identifies a given short name for a specific Shipment Condition group within a given business group.  The members of Shipment Condition groups may be different between different business groups even though the group name may be the same. This identifies the Service Package Condition when the  Shipment Condition Group Version has a Group Type Code (SHPMT_COND_GRP_TYP_CD) is set to "M" (M=Matrix). This Group is contains additional shipment conditions that further qualifies or restricts a given service which are not generally considered equipment related conditions.
                    example: R11 DEST MUST WT LIMIT  NEW
                additionalProperties: false
            priceAuthorityGroups:
              type: object
              description: Identifies all of the Groups that may defined for a give Price Authority and may consist of Geographic Groups, Commodity Groups, and Shipment Condition Groups.
              required:
              - geographicGroup
              - commodityGroup
              - shipmentConditionGroup
              properties:
                geographicGroup:
                  type: array
                  description: Identifies a Geographic Group which contains one or more Geographic Elements that qualify a Price Authority.
                  items:
                    type: object
                    required:
                    - geoGroupMembers
                    properties:
                      geoGroupShortName:
                        type: string
                        example: BNSF 5 CHICAGO
                      geoGroupMembers:
                        type: array
                        items:
                          type: string
                          example: County of DUPAGE,IL
                    additionalProperties: false
                commodityGroup:
                  type: array
                  description: Identifies a Commodity Group which contains one or more Commodity Elements that qualify a Price Authority.
                  items:
                    type: object
                    required:
                    - commodityGroupMembers
                    properties:
                      commodityGroupShortName:
                        type: string
                      commodityGroupMembers:
                        type: array
                        items:
                          type: string
                          example: 2499700-2499799
                    additionalProperties: false
                shipmentConditionGroup:
                  type: array
                  description: Identifies a Shipment Condition Group which contains one or more Shipment Condition Elements that qualify a Price Authority.
                  items:
                    type: object
                    required:
                    - shipmentConditionGroupDescription
                    - shipmentConditionGroupPublishedText
                    properties:
                      shipmentConditionGroupShortName:
                        type: string
                        example: EQ-FLAT,CB <74' SYS <205K
                      shipmentConditionGroupDescription:
                        type: string
                        example: System Flats <=74ft,  <=205,000lbs
                      shipmentConditionGroupPublishedText:
                        type: string
                        example: 'Price applies in System Centerbeam Flat Cars (Mechanical Designation: FBC - Centerbeam Flat Car), with inside length less than or equal to 74 feet with a minimum weight exceeding 1 pounds but not exceeding 205,000 pounds and System cars are owned or leased by the following class 1 carriers: BNSF, CN, UP, CP, CSXT, NS or KCS.'
                    additionalProperties: false
              additionalProperties: false
          additionalProperties: false
    OD_Pairs_Response:
      type: object
      properties:
        data:
          type: object
          properties:
            odPairsList:
              type: array
              items:
                type: object
                properties:
                  originState:
                    type: string
                    description: Origin state identifier
                    example: IL
                  originCity:
                    type: string
                    description: Origin station identifier
                    example: CHICAGO
                  destinationState:
                    type: string
                    description: Destination state identifier
                    example: TX
                  destinationCity:
                    type: string
                    description: Destination station identifier
                    example: HOUSTON
                  originSPLC:
                    type: string
                    example: '380000'
                  originFSAC:
                    type: string
                    example: '66000'
                  originR260JCT:
                    type: string
                    example: CHGO
                  destSPLC:
                    type: string
                    example: '684800'
                  destFSAC:
                    type: string
                    example: '35100'
                  destR260JCT:
                    type: string
                    example: HUSTN
                  miles:
                    type: string
                    example: '1257'
                  status:
                    type: string
                    example: '200'
                  errorMessage:
                    type:
                    - string
                    - 'null'
                    example: null
                additionalProperties: false
            status:
              type: string
              example: SUCCESS
            httpStatus:
              type: string
              example: '200'
          additionalProperties: false
    prices_response:
      type: object
      title: Prices Response
      properties:
        status:
          type: string
          title: Status
          description: Response status of the API
          example: SUCCESS
        message:
          type: object
          title: Message
          properties:
            errors:
              type: array
              title: Errors
              items:
                type: string
            results:
              $ref: '#/components/schemas/Price_Authority'
          additionalProperties: false
        httpStatus:
          type: string
          title: Http Status
          description: Response status code of the API
          example: '200'
      additionalProperties: false
    customerInvoice:
      type: object
      title: Customer Invoice
      required:
      - customerInvoiceDetails
      properties:
        customerInvoiceDetails:
          type: object
          title: Customer Invoice Details
          properties:
            billDueAmount:
              type: string
              title: Bill Due Amount
              description: The amount due in US dollars after adjustments and payments have been applied to total bill amount.
              example: $1999.99
            invoiceNumber:
              type: string
              title: Invoice Number
              description: Number that uniquely identifies a bill, regardless of the type of bill.
              example: 12345ABD
            invoiceTypeName:
              type: string
              title: Invoice Type Name
              description: 'The designation of the invoice type. Valid values include: Freight.'
              example: Freight
            billDueDate:
              type: string
              title: Bill Due Date
              description: Date a bill is due for payment.
              example: '2023-01-10'
            billOfLadingId:
              type: string
              title: Bill Of Lading Id
              description: Unique identifier for an instance of an internal or external customer request for the shipment of lading via rail.
              example: 100200AB
            waybillDate:
              type: string
              title: Waybill Date
              description: Waybill Date is the day, month, and year specified on a waybill, expressed as CCYYMMDD where CC represents the first two digits of the calendar year. Can not be in the future.
              example: '2023-01-10'
            invoiceDate:
              type: string
              title: Invoice Date
              description: Date an invoice was created.
              example: '2023-01-10'
            waybillNumber:
              type: string
              title: Waybill Number
              description: Waybill Number is the carrier accounting number of a waybill.
              example: '989999'
            freightRateAuthoritySourceName:
              type: string
              title: Freight Rate Authority Source Name
              description: The source from which the rate authority for freight charges to customers is defined.
              example: TARIFF_ITEM
            billAdjustedAmount:
              type: string
              title: Bill Adjusted Amount
              description: The amount to be added or subtracted from the bill amount.
              example: $323.99
            billPreviouslyDisputedIndicator:
              type: string
              title: Bill Previously Disputed Indicator
              description: 'Indicates whether the bill has been previously disputed or not. Valid values: Y (The bill has been previously disputed), N (The bill has not been previously disputed)'
              example: Y
            invoiceRecipientCompanyCode:
              type: string
              title: Invoice Recipient Company Code
              description: 'Code indicating the subsidiary company or other outside company that is the recipient of the invoice amount. Valid values include: 01 (The Atchison, Topeka and Santa Fe Railway Company), 02 (The Clinton and Oklahoma Western Railroad Company), 18 (The Star Lake Railroad Company).'
              example: '01'
            businessUnitCode:
              type: string
              title: Business Unit Code
              description: 'Code that identifies the high level business unit a shipment is associated with. Valid values include: 01 (Intermodal), 03 (Automotive and Steel), 04 (Bulk Commodities), 05 (Consumer Products), 06 (Forest Products), 07 (Grain Products), etc.'
              example: '01'
            patronCode:
              type: string
              title: Patron Code
              description: An approved patron code represents a customer who ships (or wants to ship) with BNSF and has established a credit arrangement with the BNSF treasury department.
              example: ABCD12
            cashBookCode:
              type: string
              title: Cash Book Code
              description: 'Code assigned by accounting indicating the type of charges for bookkeeping purposes. Valid values include: 201=Rental Bills, 202=Miscellaneous Railroad Bills, 211=Car Repair Bills, 215 =Rolling Stock, 220=Crossing Maintenance Bills, etc.'
              example: '201'
            cashBookGroupCode:
              type: string
              title: Cash Book Group Code
              description: 'Code assigned by accounting indicating the grouping of charges for bookkeeping purposes. Valid values include: DEM (Demurrage), FIN (Finance).'
              example: DEM
            payerOfFreight633:
              type: string
              title: Payer of Freight 633
              description: Name of the person or entity with responsibility for paying charges associated with the shipment. Value has been abbreviated from the Customer's full Legal Name through the use of a standardized programmatic process.
              example: ACMECUST
            payerOfFreightFullName:
              type: string
              title: Payer of Freight Full Name
              description: Full name of the person or entity with responsibility for paying charges associated with the shipment.
              example: ACME Customer
            payerOfFreightAddressText:
              type: string
              title: Payer of Freight Address Text
              description: The full address of the person or entity with responsibility for paying charges associated with the shipment.
              example: 345 Dream St. Fort Worth 76137 US
            careOfPartyFullName:
              type: string
              title: Care of Party Full Name
              description: The full name of a receiver of rail cars on behalf of the actual consignee (the physical delivery point).
              example: Care of Party Customer
            attentionPartyFullName:
              type: string
              title: Attention Party Full Name
              description: The name of the person or entity to whose attention information of a waybill will be sent.
              example: Attention Customer
            cifId:
              type: string
              title: CIF Id
              description: CIF ID (Customer Identification File) is a unique identifier used in exchanges of shipment information to accurately identify a transportation company customers and their locations.
              example: '656999'
            shipper633:
              type: string
              title: Shipper 633
              description: Name of a Customer, acting as the Shipper, which has been abbreviated from the Customer's full Legal Name through the use of a standardized programmatic process.
              example: ACMECUST
            shipperFullName:
              type: string
              title: Shipper Full Name
              description: Full name of a Customer, acting as the Shipper.
              example: ACME Customer
            origin333:
              type: string
              title: Origin 333
              description: Name of a City, defined as the origin of a shipment, which has been abbreviated from the City's Full Name through the use of a standardized programmatic process.
              example: TRNTOWN
            originStateCode:
              type: string
              title: Origin State Code
              description: The code, as assigned by a national body such as the US Postal Service, for a state, province, or territory for a given origin.
              example: TX
            consignee633:
              type: string
              title: Consignee 633
              description: Name of a Customer, acting as the Consignee (AKA Receiver), which has been abbreviated from the Customer's full Legal Name through the use of a standardized programmatic process.
              example: CNSGNEE
            consigneeFullName:
              type: string
              title: Consignee Full Name
              description: The full name of a customer that is filling the role of Consignee. A Consignee, also referred to as the "Receiver", is the company or individual receiving a shipment at a destination.
              example: Consignee
            destination333:
              type: string
              title: Destination 333
              description: Name of a City, defined as the destination of a shipment, which has been abbreviated from the City's Full Name through the use of a standardized programmatic process.
              example: TRNVILL
            destinationStateCode:
              type: string
              title: Destination State Code
              description: The code, as assigned by a national body such as the US Postal Service, for a state, province, or territory for a given destination.
              example: MT
            currencyCode:
              type: string
              title: Currency Code
              description: 'Code to designate a currency based on the ISO 4217 standard. Valid values include: USD, MXN, CAD, etc.'
              example: CAD
            intermodalServicePlanCode:
              type: string
              title: Intermodal Service Plan Code
              description: 'Code that defines the service plan associated with intermodal shipments. Valid values include: 25 (Ramp to Ramp service, Domestic, Rail owned equipment), 80 (Door to Door service, International, Steamship Owned equipment), etc.'
              example: '25'
            intermodalServiceLevelCode:
              type: string
              title: Intermodal Service Level Code
              description: 'A code representation of the level of service BNSF provides/offers, which indicates intermodal transportation service (transit time) on BNSF''s network. Service levels are reflected in the intermodal price authorities and service schedules. Valid values are: E (Expedited), P (Premium), V (Value), Y (Empty).'
              example: E
            freightUnitRateList:
              type: array
              title: Freight Unit Rate List
              items:
                type: object
                properties:
                  freightPerUnitRate:
                    type: string
                    title: Freight Per Unit Rate
                    description: The amount in dollars per unit of freight.
                    example: $999.50
                  freightUnitCount:
                    type: string
                    title: Freight Unit Count
                    description: The number of freight units.
                    example: '5'
                additionalProperties: false
            miscellaneousChargeList:
              type: array
              title: Miscellaneous Charge List
              items:
                type: object
                properties:
                  miscellaneousChargeAmount:
                    type: string
                    title: Miscellaneous Charge Amount
                    description: Amount in dollars for miscellaneous charges.
                    example: $1999.99
                  miscellaneousChargeTypeCode:
                    type: string
                    title: Miscellaneous Charge Type Code
                    description: 'Code to indicate the type of miscellaneous charges. Valid values include: CCA (Carrier Credit Allowance), TRN (Transit), SWC (Switching Charges), etc.'
                    example: CCA
                additionalProperties: false
            customerWaybillReferenceNumberList:
              type: array
              title: Customer Waybill Reference Number List
              items:
                type: object
                properties:
                  waybillReferenceNumberTypeCode:
                    type: string
                    title: Waybill Reference Number Type Code
                    description: A code defining the type of reference number or identifier associated with a Waybill.
                    example: WBREFNBR
                  waybillReferenceNumberTypeName:
                    type: string
                    title: Waybill Reference Number Type Name
                    description: A short, free-form description of a code defining the type of reference number or identifier associated with a Waybill.
                    example: Waybill Customer Reference
                  waybillReferenceNumber:
                    type: string
                    title: Waybill Reference Number
                    description: A reference number or identifier associated with a Waybill.
                    example: '123456'
                additionalProperties: false
            paymentList:
              type: array
              title: Payment List
              items:
                type: object
                properties:
                  customerInvoicePaymentNumber:
                    type: string
                    title: Customer Invoice Payment Number
                    description: Number identifying a payment made by a customer against an invoice. The payment can be made with a check, previous credits or other means.
                    example: '1002501'
                  customerInvoicePaymentDate:
                    type: string
                    title: Customer Invoice Payment Date
                    description: Date payment was made by a customer against an invoice.
                    example: '2023-01-18'
                  customerInvoicePaymentAmount:
                    type: string
                    title: Customer Invoice Payment Amount
                    description: Amount of payment issued by a customer against an invoice.
                    example: $1999.99
                additionalProperties: false
            equipmentList:
              type: array
              title: Equipment List
              items:
                type: object
                properties:
                  accountingWaybillEquipmentGroupId:
                    type: string
                    title: Accounting Waybill Equipment Group Id
                    description: Identifier used to group one or more freight rating result entries together for association to the accounting waybill equipment for which they apply.
                    example: '0'
                  equipmentInitial:
                    type: string
                    title: Equipment Initial
                    description: Equipment Initial is the prefix or alphabetic part of an equipment units identifying number.
                    example: ABCD
                  equipmentNumber:
                    type: string
                    title: Equipment Number
                    description: Equipment Number is the sequencing or serial part of an equipment units identifying number.
                    example: '123456'
                  commodityDescription:
                    type: string
                    title: Commodity Description
                    description: Description of the commodity.
                    example: PLASTC
                  stcc:
                    type: string
                    title: STCC
                    description: STCC (Standard Transportation Commodity Code) number identifying a Commodity.
                    example: '2821142'
                  carKindCode:
                    type: string
                    title: Car Kind Code
                    description: Code that identifies the physical characteristics for equipment as defined by BNSF Railway itself.
                    example: A7E
                  aarCarKindCode:
                    type: string
                    title: AAR Car Kind Code
                    description: Code that identifies the physical characteristics for equipment as defined by AAR (Association of American Railroads)
                    example: Z130
                  shipmentNetScaleWeightPounds:
                    type: string
                    title: Shipment Net Scale Weight Pounds
                    description: The net scale weight of a shipment, as measured in pounds.
                    example: '100'
                  freightRateMinimumWeightPounds:
                    type: string
                    title: Freight Rate Minimum Weight Pounds
                    description: The minimum weight in pounds of a piece of equipment and cargo that make possible a freight rate to take effect.
                    example: '2000'
                  equipmentLengthFeet:
                    type: string
                    title: Equipment Length Feet
                    description: The length, in feet, of a piece of rail equipment.
                    example: '23'
                  equipmentOutsideHeightFeet:
                    type: string
                    title: Equipment Outside Height Feet
                    description: The height, in feet, of the outside of a piece of equipment.
                    example: '20'
                  equipmentVolumeCubicFeet:
                    type: string
                    title: Equipment Volume Cubic Feet
                    description: Volume capacity of a piece of equipment in cubic feet.
                    example: '7300'
                  billOfLadingId:
                    type: string
                    title: Bill Of Lading Id
                    description: Unique identifier for an instance of an internal or external customer request for the shipment of lading via rail.
                    example: 100200AB
                  aarRule260CarrierAbbreviation:
                    type: string
                    title: AAR Rule 260 Carrier Abbreviation
                    description: Abbreviation of the carrier that is to assume responsibility for the movement of a shipment at the junction location per the AAR Rule 260.
                    example: AERC
                  cotId:
                    type: string
                    title: COT Id
                    description: Identifier assigned by the marketing department that guarantees future placement of equipment for a specific period and locks in a rate for the customer that is awarded the Certificate of Transportation (COT).
                    example: COT123456
                  cotCreditAmount:
                    type: string
                    title: COT Credit Amount
                    description: Certificate of Transportation (COT) credit amount in dollars applied to a movement waybill.
                    example: $1999.99
                  cotPremiumAmount:
                    type: string
                    title: COT Premium Amount
                    description: Certificate of Transportation (COT) premium amount in dollars applied to a movement waybill.
                    example: $1999.99
                  cotDiscountAmount:
                    type: string
                    title: COT Discount Amount
                    description: Certificate of Transportation (COT) discount in dollars applied to a movement waybill.
                    example: $1999.99
                  cotEffectiveRateDate:
                    type: string
                    title: COT Effective Rate Date
                    description: Date the Certificate of Transportation (COT) rate becomes effective.
                    example: '2023-01-10'
                additionalProperties: false
            vinList:
              type: array
              title: VIN List
              description: Comma separated list of VIN (Vehicle Identification Numbers).
              items:
                type: string
                example: 4Y1SL65848Z411439, 1HGBH41JXMN109186, 1FTFX1E57JKE37092
            totalGrossEquipmentCommodityWeightPounds:
              type: string
              title: Equipment Gross Scale Weight Pounds
              description: Total weight of equipment and commodity in pounds.
              example: '200'
            totalCommodityWeightPounds:
              type: string
              title: Shipment Net Scale Weight Pounds
              description: The total weight in pounds of the commodity.
              example: '100'
            totalEquipmentTarePounds:
              type: string
              title: Equipment Tare Pounds
              description: The total weight in pounds of all empty equipment.
              example: '500'
            totalCotCreditAmount:
              type: string
              title: Total COT Credit Amount
              description: Certificate of Transportation (COT) total credit amount in dollars applied to a movement waybill.
              example: $1999.99
            totalInvoiceAmount:
              type: string
              title: Total Invoice Amount
              description: Total amount of the invoice in dollars.
              example: $1999.99
            totalBillDueAmount:
              type: string
              title: Total Bill Due Amount
              description: The total amount due in US dollars after adjustments and payments have been applied to total bill amount.
              example: $1999.99
            totalInvoicePaymentAmount:
              type: string
              title: Total Invoice Payment Amount
              description: The total payment amount issued by a customer against an invoice.
              example: $1999.99
          additionalProperties: false
        apiResponseElementCount:
          type: string
          title: API Response Element Count
          description: Number of individual elements within the API response.
          example: '5'
        apiResponsePageNumber:
          type: string
          title: API Response Page Number
          description: Current page number within the API response.
          example: '2'
        apiResponseElementPerPageCount:
          type: string
          title: API Response Element Per Page Count
          description: Number of individual elements per page within the API response.
          example: '8'
        apiResponseTotalCurrentInvoiceAmount:
          type: string
          title: API Response Total Current Invoice Amount
          description: Total amount of the current invoices within the API response which bill due date is later or equal to the current date.
          example: $1000.18
        apiResponseTotalPastInvoiceAmount:
          type: string
          title: API Response Total Past Invoice Amount
          description: Total amount of the past invoices within the API response which bill due date is before the current date.
          example: $18999.00
        apiResponseTotalInvoiceAmount:
          type: string
          title: API Response Total Invoice Amount
          description: Total amount of the invoices included in the API response.
          example: $19999.18
      additionalProperties: false
    tripPlan:
      type: object
      title: Event Code
      properties:
        jobStatus:
          type: integer
          format: int32
          title: jobStatus
          minimum: 1
          maximum: 4
          example: '4'
        jobStatusDescription:
          type: string
          title: jobStatusDescription
          description: '* 1: Job in queue

            * 2: Job is running

            * 3: The job has data available

            * 4: The job is complete'
          example: Job is complete
        resultSet:
          type: array
          title: resultSet
          items:
            type: object
            required:
            - equipmentLoadEmptyStatusCode
            - eventCode
            - eventDescription
            - eventStatusCode
            properties:
              equipmentLoadEmptyStatusCode:
                type: string
                title: Equipment Status Code
                description: L or E, this code describes whether the equipment is loaded or empty.
                example: L
              eventCode:
                type: string
                title: Event Code
                description: ' Event Code indicates the event/activity abbreviation.'
                example: AD
              eventDescription:
                type: string
                title: Event Description
                description: Description for an Event Code used to define an event or activity occurring on the rail network.
                example: Add Car
              eventStatusCode:
                type: string
                title: Event Location Name
                description: 'Event Status Code used with event code representing equipment activity. '
                example: AD
        rowCount:
          type: integer
          format: int32
          title: rowCount
          example: '1'
    umler:
      type: array
      title: UMLER
      items:
        type: object
        required:
        - equipmentInitial
        - equipmentNumber
        properties:
          equipmentInitial:
            type: string
            title: Equipment Initial
            description: Equipment Initial is the prefix or alphabetic part of an equipment units identifying number.
            example: BNSF
          equipmentNumber:
            type: string
            title: Equipment Number
            description: Equipment Number is the sequencing or serial part of an equipment units identifying number.
            example: '12345'
          equipmentGroupCode:
            type: string
            title: Equipment Group Code
            description: Code that defines the logical grouping of equipment into major car types.
            example: CHSS (Chassis)
          equipmentDraftGearTypeCode:
            type: string
            title: Equipment Draft Gear Type Code
            description: 'A code that defines the type of equipment that connects the couplings to the rolling stock, known as the draft gear or draw gear.

              Railinc Element ID B073. Umler Element EQMVCPDS'
            example: C
          grossRailWeightPounds:
            type: number
            format: float
            title: Gross Rail Weight Pounds
            description: The maximum permissible weight on rail of the equipment and the load, reported in pounds.
            example: 287400
          shipmentLoadLimitPounds:
            type: number
            format: float
            title: Shipment Load Limit Pounds
            description: The number of pounds a shipment is allowed to weigh, the load limit, in order to allow it to be safely moved over rail.
            example: '144900'
          equipmentTareWeightPounds:
            type: number
            format: float
            title: Equipment Tare Weight Pounds
            description: Equipment Tare Weight is the weight of an empty rail shipping container or vehicle measured in pounds. Sometimes called the unladen weight.
            example: 142500
          equipmentExternalLengthInches:
            type: number
            format: float
            title: Equipment External Length Inches
            description: The external length, measured in inches, of a piece of equipment.
            example: 1020
          equipmentTruckSideBearingTypeCode:
            type: string
            title: Equipment Truck Side Bearing Type Code
            description: "Code that defines the type of constant contact bearing located on the equipment's truck side. These bearings are used to stabilize equipment on curves and in high-speed service. \nRailinc Element ID A146"
            example: LC (Long Travel Constant Contact)
          equipmentSpeedRestrictionLoadEmptyStatusCode:
            type: string
            title: Equipment Speed Restriction Load Empty Status Code
            description: Code that defines that a speed restriction related to the loaded or empty status applies to a piece of BNSF equipment.
            example: L (Loaded)
          equipmentSpeedRestrictionCode:
            type: string
            title: Equipment Speed Restriction Code
            description: Code that defines a speed restriction, in MPH (miles per hour), that applies to rail or rail equipment.
            example: 15 (15 MPH)
          specialConditionHandlingInstructionsCodeOne:
            type: string
            title: Special Condition Handling Instructions Code One
            example: RE
          specialConditionHandlingInstructionsCodeTwo:
            type: string
            title: Special Condition Handling Instructions Code Two
            description: The second set of instructions, conditions, or handling requirements for a shipment that help ensure that trains are built properly, safe movement occurs, shipments are held (e.g., clearance, customs, etc.), and awareness can be brought to any special handling needs.
            example: DK
          specialConditionHandlingInstructionsCodeThree:
            type: string
            title: Special Condition Handling Instructions Code Three
            description: The third set of instructions, conditions, or handling requirements for a shipment that help ensure that trains are built properly, safe movement occurs, shipments are held (e.g., clearance, customs, etc.), and awareness can be brought to any special handling needs.
            example: HV
          specialConditionHandlingInstructionsCodeFour:
            type: string
            title: Special Condition Handling Instructions Code Four
            description: The fourth set of instructions, conditions, or handling requirements for a shipment that help ensure that trains are built properly, safe movement occurs, shipments are held (e.g., clearance, customs, etc.), and awareness can be brought to any special handling needs.
            example: DH
          bnsfCarKindName:
            type: string
            title: BNSF Car Kind Name
            description: Name given to physical characteristics for equipment as defined by BNSF Railway itself. Value is used when car characteristics are required for business decision making.
            example: UU2
          bnsfPoolId:
            type: string
            title: BNSF Pool ID
            description: A four-digit code used by BNSF for a pool of cars assigned to a specific loading location.
            example: '0000'
          bnsfPoolAlphabeticCode:
            type: string
            title: BNSF Pool Alphabetic Code
            description: An alphabetic code assigned to categorize a Pool of cars as assigned by BNSF.
            example: PSGR
          equipmentAxleCount:
            type: number
            format: float
            title: Equipment Axle Count
            description: The total number of axles attached to a piece of equipment.
            example: 4
          articulatedUnitAirBrakeControlValveCount:
            type: number
            format: float
            title: Articulated Unit Air Brake Control Valve Count
            description: 'The total number of operating air brake valves, excluding hand breaks, found on an articulated unit.

              Railinc Element ID A182.'
            example: 1
    hazardousCommodities:
      type: array
      title: Hazardous Commodities
      items:
        type: object
        title: Hazardous Commodity
        required:
        - stcc
        - commodityRegulatoryAuthorityCode
        - hazardousCommodityProperShippingNameSequenceNumber
        properties:
          stcc:
            type: string
            title: STCC
            description: STCC (Standard Transportation Commodity Code) number identifying a Commodity.
            example: '4809195'
          commodityRegulatoryAuthorityCode:
            type: string
            title: Commodity Regulatory Authority Code
            description: Code that defines the authority body(s) defining the regulatory  requirements for a commodity.
            example: N
          hazardousCommodityProperShippingNameSequenceNumber:
            type: string
            title: Hazardous Commodity Proper Shipping Name Sequence Number
            description: The order to be applied to the Proper Shipping Name(s) for a hazardous commodity.
            example: '1'
          unnaNumber:
            type: string
            title: UNNA Number
            description: A number assigned to identify or classify a hazardous commodity/material as assigned by the UN (United Nations) or NA (North American/US DOT), required in commerce and transportation.
            example: UN1952
          hazardousCommodityClassificationCode:
            type: string
            title: Hazardous Commodity Classification Code
            description: Code indicating the classification applied to a hazardous commodity. May include Canadian, United States, and international codes depending on the data storage file and the type of shipments.
            example: '2.2'
          hazardousCommoditySecondaryClassificationCode:
            type: string
            title: Hazardous Commodity Secondary Classification Code
            description: Code indicating the secondary classification applied to a hazardous commodity. May include Canadian, United States, and international codes depending on the data storage file and the type of shipments.
            example: '7'
          canadianHazardousCommoditySubsidiaryClassification1:
            type: string
            title: Canadian Hazardous Commodity Subsidiary Classification 1
            description: The first, primary, Canadian Hazardous Commodity Subsidiary Classification associated with a given material being shipped.
            example: '5.1'
          canadianHazardousCommoditySubsidiaryClassification2:
            type: string
            title: Canadian Hazardous Commodity Subsidiary Classification 2
            description: The second, secondary, Canadian Hazardous Commodity Subsidiary Classification associated with a given material being shipped.
            example: '8'
          canadianHazardousCommoditySubsidiaryClassification3:
            type: string
            title: Canadian Hazardous Commodity Subsidiary Classification 3
            description: The third possible Canadian Hazardous Commodity Subsidiary Classification associated with a given material being shipped.
            example: '8'
          commodityPackagingGroupCode1:
            type: string
            title: Commodity Packaging Group Code 1
            description: Code which designates the first of up to three, Canadian or International, Packaging Groups assigned to a commodity.
            example: A
          commodityPackagingGroupCode2:
            type: string
            title: Commodity Packaging Group Code 2
            description: Code which designates the second of up to three, Canadian or International, Packaging Groups assigned to a commodity.
            example: '1'
          commodityPackagingGroupCode3:
            type: string
            title: Commodity Packaging Group Code 3
            description: Code which designates the third of up to three, Canadian or International, Packaging Groups assigned to a commodity.
            example: '2'
          hazardousCommodityProperShippingName:
            type: string
            title: Hazardous Commodity Proper Shipping Name
            description: The full Proper Shipping Name assigned to a Hazardous Commodities as required by US, Canadian, and International Regulations.
            example: WASTE ETHYLENE OXIDE AND CARBON DIOXIDE MIXTURES
          hazardousCommodityProperShippingAugmentationRequiredIndicator:
            type: string
            title: Hazardous Commodity Proper Shipping Augmentation Required Indicator
            description: Indicates if Hazardous Commodity Proper Shipping Name(s) should be augmented with a Technical Name.
            example: Y
          hazardousSubstanceComponentDescription:
            type: string
            title: Hazardous Substance Component Description
            description: Description of an element, or compound, associated with a hazardous substance.
            example: NICKLE POWDER
          hazardousCommodityToxicityTypeCode:
            type: string
            title: Hazardous Commodity Toxicity Type Code
            description: Code that defines the specific toxicity related statement required to be attached to the shipping papers when transporting a hazardous commodity.
            example: P
          primaryHazardousPlacardCode:
            type: string
            title: Primary Hazardous Placard Code
            description: The primary code, as defined by the US DOT or Canada, to be assigned to the hazardous placard when transporting/shipping hazardous materials.
            example: FL
          secondaryHazardousPlacardCode:
            type: string
            title: Secondary Hazardous Placard Code
            description: The secondary code, as defined by the US DOT or Canada, to be assigned to the hazardous placard when transporting/shipping hazardous materials.
            example: CP
          canadianSpecialCommodityStatementCode:
            type: string
            title: Canadian Special Commodity Statement Code
            description: Code that defines, per Canadian Regulations, what statement related to a special commodity are required to be included on the shipping papers.
            example: A
          canadianEmergencyResponsePlanRequiredCode:
            type: string
            title: Canadian Emergency Response Plan Required Code
            description: Code that defines what, if any, Emergency Response Assistance Plan (ERAP) reference number and telephone number are required to appear on the shipping paper.
            example: E
          hazardousCommodityUsdotInhalationHazardZoneCode:
            type: string
            title: Hazardous Commodity USDOT Inhalation Hazard Zone Code
            description: Code, assigned by the US DOT, that specifies any hazardous zone information that is required to be part of the shipping papers when transporting hazardous commodities that are considered to be poisonous by inhalation.
            example: B
          combustibleHazardousCommodityIndicator:
            type: string
            title: Combustible Hazardous Commodity Indicator
            description: Code that defines if the associated commodity is considered to be combustible (Class 3 Commodities include items that are made of natural fibers including paper products or products made of wood).
            example: C
          marinePollutantComponentDescription:
            type: string
            title: Marine Pollutant Component Description
            description: Description of the component in a hazardous material shipment that makes it a marine pollutant.
            example: TETRAETHYL LEAD CARBON TETRACHLORIDE
    stcc:
      type: array
      title: stcc
      items:
        type: object
        required:
        - stcc
        - commodityDescription
        - commodityDescriptionAbbreviation
        properties:
          stcc:
            type: string
            title: stcc
            description: STCC (Standard Transportation Commodity Code) number identifying a Commodity.
            example: '0113710'
          commodityDescription:
            type: string
            title: commodityDescription
            description: The description of the commodity.
            example: WHEAT
          commodityDescriptionAbbreviation:
            type: string
            title: commodityDescriptionAbbreviation
            description: A short description of the commodity.
            example: WHEAT
    station:
      type: array
      title: Station
      items:
        type: object
        required:
        - scac
        - fsac
        - splc
        - railincRegisteredStationIndicator
        - stationName
        - station333
        - stationStateCode
        - railincStation333
        - r260JunctionCode
        - stationSixCharacterAbbreviation
        - stationThreeCharacterAbbreviation
        - stationTwoCharacterAbbreviation
        - stationTimeZoneCode
        - crewTimeReportingTimeZoneCode
        - stationTssTimeZoneCode
        - stationObservesDaylightSavingTimeIndicator
        - opslStationNumber
        - opslStationSubNumber
        - opslStationName
        - stationLatitude
        - stationLongitude
        - systemBlockNumber
        - stationCarhireReloadAbbreviation
        - stationCustomsInspectionRequiredIndicator
        - grainInspectionRequiredIndicator
        - stationAutomotiveRampTypeCode
        - stationTssRampTypeCode
        - stationMaximumGrossWeightPounds
        - stationOperatingPlateCode
        - stationLocomotiveFuelingTypeCode
        - stationImportExportTypeCode
        - stationTrainClassificationServiceLevelCode
        - fipsCountyCode
        - usbeaRegionCode
        - usbeaCountyName
        - stationReportingScac
        - payrollTripTicketPrefixCode
        - updateDatetime
        - componentEconomicAreaCode
        - stationScacInternationalCarrierIndicator
        - stationOnsiteScaleIndicator
        - stationOnsiteCleaningFacilitiesIndicator
        - stationTrafficTypeCode
        - stationMechanicalRegionCode
        - stationMechanicalZoneName
        - stationEmbargoIndicator
        properties:
          scac:
            type: string
            title: SCAC
            description: SCAC (Standard Carrier Alpha Code) consists of a two to four character alpha abbreviation used to designate a transportation company. SCACs are assigned by NMFTA (National Motor Freight Traffic Association).
            example: BNSF
          fsac:
            type: string
            title: FSAC
            description: FSAC (Freight Station Accounting Code) is a number assigned to a station that uniquely identifies the station within the context of each reporting railroad (i.e., Different railroads might share identical FSAC numbers).
            example: '1234'
          splc:
            type: string
            title: SPLC
            description: SPLC (Standard Point Location Code) is a six-to-nine digit geographic code used by North American transportation industries, which serves as the official code assigned to a city or point (for rate making purposes) within a city.
            example: '1234'
          railincRegisteredStationIndicator:
            type: string
            title: Railinc Registered Station Indicator
            description: Indicates is the associated Station is registered with Railinc.
            example: Y
          stationName:
            type: string
            title: Station Name
            description: Name of a station. This may or may not be the fully spelled name of the station but it is NOT the standard 333 abbreviated name.
            example: PARKWATER
          station333:
            type: string
            title: Station 333
            description: Name of a City, where a Station is located, which has been abbreviated from the City's Full Name through the use of a standardized programmatic algorithm.
            example: PRKWTR
          stationStateCode:
            type: string
            title: Station State Code
            description: Station State Code is a code value, as defined by the appropriate government agency of the United States, Canada, or Mexico, specifying the state or province of a station.
            example: WA
          railincStation333:
            type: string
            title: Railinc Station 333
            description: 333 Abbreviated name for the city where a station is located as defined by Railinc and not by BNSF.  See also Station 333.
            example: PARKWTR
          r260JunctionCode:
            type: string
            title: R260 Junction Code
            description: R260 Junction Code is a code value (as specified by AAR Accounting Rule 260) which specifies a junction where two rail carriers interchange shipments.
            example: PRKWT
          stationSixCharacterAbbreviation:
            type: string
            title: Station Six Character Abbreviation
            description: Six character abbreviation for a BNSF, MRL (Montana Rail Line), or LAJ (Los Angeles Junction Railway) Station.  Internal value assigned at BNSF.
            example: PRKWAT
          stationThreeCharacterAbbreviation:
            type: string
            title: Station Three Character Abbreviation
            description: Three character abbreviation for a BNSF, MRL (Montana Rail Line), or LAJ (Los Angeles Junction Railway) Station.  Internal value assigned at BNSF.
            example: PAT
          stationTwoCharacterAbbreviation:
            type: string
            title: Station Two Character Abbreviation
            description: Two character abbreviation for a BNSF, MRL (Montana Rail Line), or LAJ (Los Angeles Junction Railway) Station.  Internal value assigned at BNSF.
            example: PA
          stationTimeZoneCode:
            type: string
            title: Station Time Zone Code
            description: Code that defines the time zone where a station is physically located.
            example: C
          crewTimeReportingTimeZoneCode:
            type: string
            title: Crew Time Reporting Time Zone Code
            description: Code that defines the time zone where the crew reports time when working at a given station. This value may or may not be the same as the time zone of the station itself.
            example: C
          stationTssTimeZoneCode:
            type: string
            title: Station TSS Time Zone Code
            description: Code that defines the time zone for a station as recorded within BNSF's TSS (Transportation Support System) application.
            example: C
          stationObservesDaylightSavingTimeIndicator:
            type: string
            title: Station Observes Daylight Saving Time Indicator
            description: Indicates whether or not the station observed Daylight Savings Time.
            example: Y
          opslStationNumber:
            type: string
            title: OPSL Station Number
            description: The OPSL (Open and Prepay Station List) number assigned to a Railroad Station. Value is generated and maintained by the Business Services Division of Railinc.
            example: '3165'
          opslStationSubNumber:
            type: string
            title: OPSL Station Sub Number
            description: Sub-number assigned to further define the Station as recorded within the OPSL (Open and Prepay Station List). This list is maintained at the Industry level for all Registered Stations.
            example: '00'
          opslStationName:
            type: string
            title: OPSL Station Name
            description: Name of the Station as recorded on the OPSL (Open and Prepay Station List) from which the Station information was recorded.
            example: PARKWATER
          stationLatitude:
            type: number
            format: float
            title: Station Latitude
            description: The latitude, distance north or south of the equator as measured in degrees, where the Station is physically located.
            example: '39.762026'
          stationLongitude:
            type: number
            format: float
            title: Station Longitude
            description: The latitude, distance east or west of the prime meridian as measured in degrees, where the Station is physically located.
            example: '-104.995627'
          systemBlockNumber:
            type: string
            title: System Block Number
            description: System block identifying the general geographic area of the railroad assigned by the systems operations center. System block is defined as a group of stations.
            example: '14210'
          stationCarhireReloadAbbreviation:
            type: string
            title: Station Carhire Reload Abbreviation
            description: Abbreviation referring to 'Carhire Reload Station' as defined by Railinc. This abbreviation is a 5 positions alpha value.
            example: IRVIN
          stationCustomsInspectionRequiredIndicator:
            type: string
            title: Station Customs Inspection Required Indicator
            description: 'Indicates whether or not U.S. Customs is required to  perform an inspection of cars and intermodal equipment for customs clearance at the associated station. '
            example: N
          grainInspectionRequiredIndicator:
            type: string
            title: Grain Inspection Required Indicator
            description: Indicates whether or not a recognized grain inspection authority is required to perform an inspection of grain.
            example: N
          stationAutomotiveRampTypeCode:
            type: string
            title: Station Automotive Ramp Type Code
            description: Code that defines the type of Automotive Ramp located at the associated Station.
            example: F
          stationTssRampTypeCode:
            type: string
            title: Station TSS Ramp Type Code
            description: Code that defines the type of Ramp, as recorded within TSS (Transportation Support System), located at the associated Station.
            example: C
          stationMaximumGrossWeightPounds:
            type: number
            format: float
            title: Station Maximum Gross Weight Pounds
            description: The maximum gross weight, measured in pounds, that can be handled on rail at this station location.
            example: '263000'
          stationOperatingPlateCode:
            type: string
            title: Station Operating Plate Code
            description: 'The maximum Plate Size (car dimensions) that can be handled at this location.  '
            example: C
          stationLocomotiveFuelingTypeCode:
            type: string
            title: Station Locomotive Fueling Type Code
            description: Code that defines the types of fueling available at this station for a locomotive.
            example: F
          stationImportExportTypeCode:
            type: string
            title: Station Import Export Type Code
            description: Code that defines the type of imports and/or exports that are handled at the associated station.
            example: E
          stationTrainClassificationServiceLevelCode:
            type: string
            title: Station Train Classification Service Level Code
            description: Code indicating the station's class/service level for train service.
            example: '3'
          fipsCountyCode:
            type: string
            title: FIPS County Code
            description: Federal Information Processing Standard (FIPS) code for the County of the location as determined by the Bureau of Economic Analysis of the U.S. Department of Commerce.
            example: '53063'
          usbeaRegionCode:
            type: string
            title: USBEA Region Code
            description: Bureau of Economic Analysis assigned code defining geographic regional economic areas.
            example: B
          usbeaCountyName:
            type: string
            title: USBEA County Name
            description: Bureau of Economic Analysis Name value which corresponds to the FIPS County code.
            example: SPOKANE, WA
          legacyStationId:
            type: string
            title: Legacy Station ID
            description: Internal Station Randomly Generated Key field used in the Legacy Mainframe.  Not needed in the new Station Hub.
            example: '302227791'
          stationReportingScac:
            type: string
            title: Station Reporting SCAC
            description: The SCAC (Standard Carrier Alpha Code) of the carrier that reported/registered this Station at Railinc.
            example: BNSF
          payrollTripTicketPrefixCode:
            type: string
            title: Payroll Trip Ticket Prefix Code
            description: Code indicating the prefix for a payroll trip ticket. A payroll trip ticket is when the trip ticket has been approved for payment.
            example: KS
          updateDatetime:
            type: string
            title: Update DateTime
            description: The UTC* Date and Time** when a business process persists (saves) modification of business data.
            example: 2/1/2020  11:56:45 AM
          componentEconomicAreaCode:
            type: string
            title: Component Economic Area Code
            description: Component Economic Area Code in which the county specified in the FIPS County Code belongs.
            example: '7840'
          stationScacInternationalCarrierIndicator:
            type: string
            title: Station SCAC International Carrier Indicator
            description: Indicates whether or not the Station's SCAC is an international carrier.
            example: N
          stationOnsiteScaleIndicator:
            type: string
            title: Station Onsite Scale Indicator
            description: Indicates whether or not this station has a scale onsite.
            example: Y
          stationOnsiteCleaningFacilitiesIndicator:
            type: string
            title: Station Onsite Cleaning Facilities Indicator
            description: Indicates whether or not this station has cleaning facilities onsite.
            example: N
          stationTrafficTypeCode:
            type: string
            title: Station Traffic Type Code
            description: Code that defines the type of traffic that can be handled at this Station.
            example: P
          stationMechanicalRegionCode:
            type: string
            title: Station Mechanical Region Code
            description: 'The mechanical region, within the BNSF network, where the associated station is located. Note: These may differ than the Business/Marketing Regions.'
            example: '2'
          stationMechanicalZoneName:
            type: string
            title: Station Mechanical Region Code
            description: The mechanical zone, with a mechanical region, where the associated station is located.
            example: '2'
          stationComment:
            type: string
            title: Station Comment
            description: Any comment found related to a Station.
            example: Sending to Railinc as a new Add
          stationEmbargoIndicator:
            type: string
            title: Station Embargo Indicator
            description: Indicates whether or not this station has any Embargos applied to it.
            example: N
    intermodal_schedules:
