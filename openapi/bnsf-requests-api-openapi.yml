    Gate_Move_Request:
      type: object
      description: JSON document used to send and receive information related to a Customer's Drayage Booking requests.
      required:
      - carKindCode
      - equipmentInitial
      - equipmentLengthFeet
      - equipmentNumber
      - railpassId
      - shipper633
      - station333
      - stationStateCode
      - tractorLicensePlateNumber
      - tractorLicenseStateCode
      - tractorStencilId
      - truckerDriverLicenseNumber
      - truckerDriverLicenseStateCode
      - truckingScac
      properties:
        carKindCode:
          type: string
          description: Code that identifies the physical characteristics for equipment as defined by BNSF Railway itself. Value is used when car characteristics are required for business decision making.
          example: K
        chassisInitial:
          type: string
          description: Chassis Initial is the prefix or alphabetic part of a chassis unit's identifying number.
          example: ABCD
        chassisNumber:
          type: string
          description: Chassis Number is the sequencing or serial part of an Chassis unit's identifying number.
          example: '123456'
        equipmentDoorSealNumber:
          type: string
          description: Identification number for a seal. A seal is typically applied to a door on Intermodal Equipment (Containers or Trailers) prior to transit.
          example: '12345'
        equipmentInitial:
          type: string
          description: Equipment Initial is the prefix or alphabetic part of an equipment units identifying number.
          example: ABCD
        equipmentLengthFeet:
          type: string
          description: The length, in feet, of a piece of rail equipment.
          example: '40'
        equipmentNumber:
          type: string
          description: Equipment Number is the sequencing or serial part of an equipment units identifying number.
          example: '1'
        pickupNumber:
          type: string
          description: A security number provided to the notify party which allows the vehicle to outgate from (leave) a BNSF facility. The truck driver must provide the pickup number at the time of outgate.
          example: '1234'
        railpassId:
          type: string
          description: RailPASS ID
          example: ABC12
        shipper633:
          type: string
          description: Name of a Customer, acting as the Shipper, which has been abbreviated from the Customer's full Legal Name through the use of a standardized programmatic process.
          example: BNSFRAILWAY
        station333:
          type: string
          description: Name of a City which has been abbreviated from the City's Full Name through the use of a standardized programmatic algorithm.
          example: ALLIANCE
        stationStateCode:
          type: string
          description: The State code for a given station defined by a standardized State code, as assigned by a national body such as the US Postal Service.
          example: TX
        tractorLicensePlateNumber:
          type: string
          description: The license plate number attached to the tractor portion of a tractor trailer (AKA Semi).
          example: '1234567'
        tractorLicenseStateCode:
          type: string
