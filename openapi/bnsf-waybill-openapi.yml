                      \ of freight conveyance equipment on a BOL.\r\nThe purpose of the sequence number is to preserve the\
                      \ order of equipment as supplied on the EDI  404 or other channel. Sequence values should start from\
                      \ one (1) and increment by one for each piece of equipment on the request."
                    example: 1
                  billOfLadingEquipmentQuantity:
                    type: string
                    description: 'Count of the number of packages, of a specific commodity, to be shipped on a railcar as
                      defined on the BOL (Bill of Lading).


                      **EDI Mapping:** N10/01

                      '
                    example: '1'
                  billOfLadingEquipmentQuantityDescription:
                    type: string
                    description: 'Description of the commodity to be shipped on a railcar as defined on the BOL (Bill of Lading).


                      **EDI Mapping:** N10/02'
                    example: SCRAP PAPER
                  billOfLadingEquipmentWeightUnitCode:
                    type: string
