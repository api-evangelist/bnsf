                      Commodity Item Weight value.


                      **EDI Mapping:** N10/07

                      '
                    example: L
                  billOfLadingEquipmentWeight:
                    type: number
                    format: float
                    description: 'The weight of the specific commodity within a given railcar as defined on the BOL (Bill
                      of Lading). See also "BOL Commodity Item Weight UOM Code."


                      **EDI Mapping:** N10/08


                      '
                    example: 100
                  billOfLadingEquipmentManifestCode:
                    type: string
                    description: 'Code specifying the smallest type of package a commodity can be bundled into for shipping
                      on a railcar as defined on the BOL (Bill of Lading.)


                      **EDI Mapping:** N10/10

                      '
                    example: CAR
                  billOfLadingEquipmentOriginCountryCode:
                    type: string
                    description: 'Code that defines the origin country of a commodity as defined on the BOL (Bill of Lading.).


                      **EDI Mapping:** N10/11


                      '
                    example: MEX
                  billOfLadingEquipmentDestinationCountryCode:
                    type: string
                    description: 'Code that defines the destination country of a commodity as defined on the BOL (Bill of
                      Lading.).


                      **EDI Mapping:** N10/12

                      '
                    example: US
            billOfLadingSpecialHandlingInstructions:
