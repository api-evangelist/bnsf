                      Sample Values Include: AJ (Do Not Stack), AH (Humidity Sensitive Shipment), FR (Fragile - Handle with
                      Care), DNF (Do Not Freeze)


                      **EDI Mapping:** DE152/H301

                      '
                    example: AJ
            billOfLadingRouteSequences:
