    Waybill_Details:
      type: object
      properties:
        customerWaybillDetails:
          type: object
          required:
          - equipmentInitial
          - equipmentNumber
          properties:
            equipmentInitial:
              type: string
              description: Equipment Initial is the prefix or alphabetic part of an equipment units identifying number.
              example: AOKX
            equipmentNumber:
              type: string
              description: Equipment Number is the sequencing or serial part of an equipment units identifying number.
              example: '79005'
            loadEmptyCode:
              type: string
              description: 'Code which indicates the load status of a piece of equipment.

                Valid values are: L = Loaded, E = Empty, B = Both'
              example: E
            equipmentGrossScaleWeightPounds:
              type: string
              description: The gross scale weight of a piece of equipment as measured in pounds.
              example: '270648'
            equipmentTareWeightPounds:
              type: string
              description: The weight of an empty vehicle or container, as measured in pounds, without cargo. Sometimes referred
                to as Unladen Weight.
              example: '10000'
            shipmentNetScaleWeightPounds:
              type: string
              description: The net scale weight of a shipment, as measured in pounds.
              example: '202348'
            carKindCode:
              type: string
              description: Code that identifies the physical characteristics for equipment as defined by BNSF Railway itself.
                Value is used when car characteristics are required for business decision making.
              example: C5G
            billOfLadingId:
              type: string
              description: Is a unique identifier for an instance of an internal or external customer request for the Bill
                of Lading via rail.
              example: 017415FD
            waybillNumber:
              type: string
              description: Waybill Number is the carrier accounting number of a waybill.
              example: '836486'
            waybillVersionNumber:
              type: string
              description: Number added to a specific Waybill to allow for versioning of the Waybill over time.
              example: '4'
            shippingManifestId:
              type: string
              description: Identifier of a Shipping Manifest which is a list of all goods loaded onto a transport vessel.
                A manifest usually documents the items, quantity, weight, and the destination information for where the cargo
                is to go.
              example: '205481286'
            waybillDate:
              type: string
              description: Waybill Date is the day, month, and year specified on a waybill, expressed as CCYYMMDD where CC
                represents the first two digits of the calendar year. Can not be in the future.
              example: 11-12-2000
            waybillEdiCode:
              type: string
              description: Code which defines if the Waybill has an EDI code.
              example: TBL
            waybillStatusCode:
              type: string
              description: 'BNSF defined code values to track the operational lifecycle state of a Waybill''s execution from
                initialization to close. Valid Values Include: A=ACTIVATED, C=CLOSED CYCLE, O=OFFLINE, S=SUSPENDED, V=VOIDED'
              example: C
            waybillParties:
              type: array
              description: Information on interested or responsible parties associated with a Waybill.
              items:
                type: object
                properties:
                  waybillPartyRoleName:
                    type: string
                    description: Description of the Waybill Party Role Code value which provides the full name associated
                      with the role.
                    example: Consignee
                  waybillPartyFullName:
                    type: string
                    description: Full name of a Party (business or individual) that plays a part within a Waybill.
                    example: Company ABC
            waybillDetails:
              type: object
              description: Details relating to a Waybill.
              properties:
                originStationName:
                  type: string
                  description: The fully spelled out name of an origin station.
                  example: VANCOUVER
                originStateCode:
                  type: string
                  description: The code, as assigned by a national body such as the US Postal Service, for a state, province,
                    or territory for a given origin.
                  example: WA
                destinationStationName:
                  type: string
                  description: The fully spelled out name of an destination station.
                  example: CHICAGO
                destinationStateCode:
                  type: string
                  description: The code, as assigned by a national body such as the US Postal Service, for a state, province,
                    or territory for a given destination.
                  example: IL
                stcc:
                  type: string
                  description: STCC (Standard Transportation Commodity Code) number identifying a Commodity.
                  example: '9999'
                commodityDescription:
                  type: string
                  description: Text value which describes a Commodity.
                  example: CORN
                contractFreightRateQuoteNumber:
                  type: string
                  description: Number assigned to identify a quote generated for a Contract Freight Rate.
                  example: '9999'
                aarRule11Indicator:
                  type: string
                  description: Indicates if AAR (Association of American Railroads) Rule 11 applies to the shipment.  This
                    rule identifies the proper billing procedure that must be followed by each party in scenarios in which
                    through waybilling of shipments require more than one carrier to collect.
                  example: Y
                shipmentUnitCount:
                  type: string
                  description: Number of pieces of equipment that are being moved in a shipment.
                  example: '11'
              nullable: false
            waybillRoutes:
              type: array
              items:
                type: object
                properties:
                  waybillRouteScac:
                    type: string
                  aarRule260JunctionAbbreviation:
                    type: string
                    description: The AAR Rule 260 junction abbreviation associated with a segment of the route for a Waybill
                      where two rail carriers will exchange shipments.
                  waybillRouteSequenceNumber:
