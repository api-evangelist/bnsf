            billOfLadingEquipmentQuantityAndDescription:
              type: array
              description: 'Count of the number of packages, of a specific commodity, Description of the commodity to be shipped
                on a railcar as defined on the BOL (Bill of Lading).


                **EDI Mapping:** N10 Loop/N7,REF,N10

                '
              items:
                type: object
