- aid: bnsf:bnsf-schedules-api
  name: BNSF Schedules API
  description: >-
    The BNSF Schedules API provides intermodal transit schedules enabling customers to view planned departure
    and arrival times to help schedule freight shipments across the BNSF rail network.
  humanURL: https://www.bnsf.com/ship-with-bnsf/support-services/customer-api/
