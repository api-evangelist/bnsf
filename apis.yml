aid: bnsf
name: BNSF
description: 'BNSF Railway, a subsidiary of Berkshire Hathaway Inc., operates one of the largest freight
  rail networks in North America — more than 32,000 route miles across 28 states and three Canadian provinces,
  connecting to Mexico through rail lines in Texas. BNSF publishes a genuine customer-facing API programme:
  eight OpenAPI 3.0 documents totalling 59 operations covering shipment tracing, intermodal and automotive
  hub gate operations, freight pricing and invoices, intermodal schedules, waybill management, rail reference
  data and diagnostics, plus a six-event webhook push surface. Every call is authenticated with certificate-based
  mutual TLS on port 6443; there is no API key and no OAuth, and 27 of the 59 operations are Restricted
  Services requiring separate authorisation.'
