- aid: bnsf:bnsf-automotive-hub-operations-api
  name: BNSF Automotive Hub Operations API
  description: 'The BNSF Automotive Hub Operations API covers haul-away gate operations at BNSF automotive
    ramps: gate entry requests submitted before an ingate, gate exit and pre-exit requests, holds placed
    on and released from a VIN at origin or destination, and gate-pass lookups by AAR ramp code and VIN.
    Seven operations, keyed on NMFTA SCAC and AAR ramp code, serving truckers, dispatchers and vehicle
    OEMs.'
