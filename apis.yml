- aid: bnsf:bnsf-waybill-management-api
  name: BNSF Waybill Management API
  description: The BNSF Waybill Management API submits a bill of lading with the required transit information
    to create a waybill, and retrieves the current active waybill for a given piece of equipment. Its
    request schema carries ninety explicit EDI Mapping annotations binding JSON fields to ANSI X12 data
    elements, so a shipper already exchanging X12 404 rail shipment information can map field to field.
    The submission operation is a Restricted Service and has no published void, cancel or amend.
  humanURL: https://www.bnsf.com/ship-with-bnsf/support-services/customer-api/
  baseURL: https://api.bnsf.com:6443
