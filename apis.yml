- aid: bnsf:bnsf-hub-operations-api
  name: BNSF Intermodal Hub Operations API
  description: 'The BNSF Intermodal Hub Operations API covers facility operations across the BNSF intermodal
    hub network: dray bookings and dray plans, driver vehicle inspection reports, authorized flips, hub
    lot locations, ingate and outgate registration with dedicated validation operations, pre-gate creation
    and cancellation, J1 gate receipts, pickup numbers, street en-route reporting, unit details, domestic
    empties and parking updates. Twenty-three operations, twenty-one of them Restricted Services requiring
    separate BNSF authorisation and available in Production only.'
