  name: BNSF Tracing API
  description: >-
    The BNSF Tracing API provides real-time shipment tracking from origin to destination for automotive
    VINs, carload railcars, intermodal units, and trains. Supports bulk queries of up to 300 vehicles
    or units per request with detailed trip plan and event data.
