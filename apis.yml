- aid: bnsf:bnsf-hub-operations-api
  name: BNSF Hub Operations API
  description: >-
    The BNSF Hub Operations API provides access to intermodal facility data including container and trailer
    delivery details, storage locations, driver pickup and delivery information, dray bookings, gate operations,
    and unit status for intermodal hubs across the BNSF network.
  humanURL: https://www.bnsf.com/ship-with-bnsf/support-services/customer-api/
