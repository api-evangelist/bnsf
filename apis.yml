- aid: bnsf:bnsf-pricing-rates-api
  name: BNSF Prices and Rates API
  description: The BNSF Prices and Rates API returns freight shipping prices for carload and intermodal
    moves within a BNSF Price Authority, open invoices for up to five patron codes per request, and rail
    mileage for BNSF local and AAR Accounting Rule 11 shipments up to 1,000 at a time. Commodity ranges
    are expressed as STCC bounds and geography accepts SPLC, OPSL, FIPS county, state, ZIP3 and ZIP5 selectors.
    Three of the four operations are Restricted Services; the rail-mile inquiry is not.
  humanURL: https://www.bnsf.com/ship-with-bnsf/support-services/customer-api/
