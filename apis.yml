- aid: bnsf:bnsf-waybill-management-api
  name: BNSF Waybill Management API
  description: >-
    The BNSF Waybill Management API enables customers to submit bills of lading with transit details and
    retrieve submissions for carload shipments. Supports electronic submission and retrieval of waybill
    documentation for freight management.
  humanURL: https://www.bnsf.com/ship-with-bnsf/support-services/customer-api/
