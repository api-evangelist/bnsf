- aid: bnsf:bnsf-reference-files-api
  name: BNSF Reference Files API
  description: 'The BNSF Reference Files API resolves the rail industry code systems the rest of the BNSF
    surface is written in: event codes describing equipment activity, station details behind the 333 location
    codes, STCC commodity codes and their hazardous-materials detail, and Umler equipment characteristics
    covering dimensions, capacities and weights for freight cars, trailers and containers. Five operations,
    none of them restricted.'
