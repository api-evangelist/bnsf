- aid: bnsf:bnsf-tracing-api
  name: BNSF Tracing API
  description: The BNSF Tracing API provides real-time shipment tracing from origin to destination for
    automotive VINs, carload railcars, intermodal units and unit trains. Fifteen operations cover position,
    trip plans and significant-event history. Bulk POST forms accept up to 300 VINs, cars or units per
    request and up to 25 unit trains; list endpoints page at a default and maximum of 2,000 records. None
    of the fifteen is a Restricted Service, which makes this the surface a newly registered caller can
    use first.
  humanURL: https://www.bnsf.com/ship-with-bnsf/support-services/customer-api/
