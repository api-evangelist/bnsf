- aid: bnsf:bnsf-diagnostics-api
  name: BNSF Diagnostics API
  description: The BNSF Diagnostics API exposes an unauthenticated gateway health check that answers 200
    with the body <status>ok</status> on both the production and trial hosts, and a Restricted analytic-event
    operation for submitting usage telemetry. The health check is the only operation on the whole BNSF
    Customer API reachable without a registered client certificate.
