description: 'Entity graph for the BNSF Customer API. BNSF publishes no object reference page, so this is derived
  entirely from the component schemas of its own specifications. The surface has no global resource identifiers
  and no id prefixes: entities are joined on rail-industry composite keys, not on opaque ids.'
entity_count: 61
relationship_count: 9
join_keys:
- key: equipmentInitial + equipmentNumber
  standard: AAR reporting marks
  meaning: the identity of one railcar, trailer or container; the primary key of the whole surface
  used_by:
  - trace
  - intermodal-hub-operations
  - automotive-hub-operations
  - waybill
  - reference-files
- key: vin
  standard: ISO 3779 vehicle identification number
  meaning: identity of one finished vehicle on the automotive surface
  used_by:
  - trace
  - automotive-hub-operations
- key: <party>633
  standard: rail industry customer/party code
  meaning: identifies shipper, consignee, supplier, payer and other waybill parties
  used_by:
  - intermodal-hub-operations
  - webhooks
  - waybill
- key: <place>333
  standard: rail industry station/city code
  meaning: origin, destination, event and scale locations
  used_by:
  - prices
  - intermodal-hub-operations
  - automotive-hub-operations
  - diagnostics
  - webhooks
- key: scac
  standard: NMFTA Standard Carrier Alpha Code
  meaning: identifies the trucking or steamship company on a move
  used_by:
  - automotive-hub-operations
  - intermodal-hub-operations
  - webhooks
- key: aarRampCode
  standard: AAR ramp code
  meaning: identifies the automotive ramp facility
  used_by:
  - automotive-hub-operations
- key: stcc
  standard: Standard Transportation Commodity Code
  meaning: identifies what is being hauled; the join between reference data and pricing
  used_by:
  - reference-files
  - prices
- key: waybillNumber
  standard: rail waybill number
  meaning: the shipment document a trace event or a bad-order notice hangs off
  used_by:
  - waybill
  - webhooks
  - trace
no_opaque_ids_note: There is no id prefix scheme and no UUID anywhere on this surface. Every join is a composite
  of industry codes, which means an integrator must already hold the rail vocabulary to use the API at all — but
  also that records join cleanly to any other Class I railroad feed using the same codes.
